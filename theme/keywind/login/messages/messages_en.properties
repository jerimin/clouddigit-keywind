loginTitle=Welcome to Cloud Digit
loginTitleHtml=Welcome to Cloud Digit
# Keycloak runs messages through MessageFormat, which eats single quotes -
# the apostrophe must be doubled here to render as one.
loginAccountTitle=Built for what''s next...
# \u03B2 = Greek small letter beta. MUST be escaped: Java .properties are read
# as ISO-8859-1, and beta is outside that charset (unlike \u00A9).
# The badge span must NOT carry the CSS "uppercase" class, or this renders as
# a Greek capital B.
betaBadge=\u03B2eta
betaNotice=Public \u03B2eta - open to all, with features and availability still changing.
# \u00A9 is the copyright sign. NOTE: year is literal - bump each January.
copyrightNotice=\u00A9 2026 Cloud Digit. All rights reserved.
