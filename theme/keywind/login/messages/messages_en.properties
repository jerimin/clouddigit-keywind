# Browser tab title. {0} = realm display name (Helm ui/admin.realm.displayName):
# "Cloud Digit" for customers, "Cloud Digit Admin" for administrators.
loginTitle=Sign in to {0}
loginTitleHtml=Welcome to Cloud Digit
# Keycloak runs messages through MessageFormat, which eats single quotes -
# the apostrophe must be doubled here to render as one.
loginAccountTitle=Built for what''s next...
# Service stage, same wording as clouddigit.ai (the stage is early access since 1 Nov 2026).
# The keys keep their old names: betaBadge = the chip under the tagline,
# betaNotice = the first footer line.
betaBadge=Early access
betaNotice=Early access - open to all, with features and availability still changing.
# \u00A9 is the copyright sign. NOTE: year is literal - bump each January.
copyrightNotice=\u00A9 2026 Cloud Digit. All rights reserved.
